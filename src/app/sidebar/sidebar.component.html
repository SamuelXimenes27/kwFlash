<div class="sidebar-wrapper">
  <div class="logo">
    <a href="/" class="simple-text logo-mini">
      <div class="logo-image-small">
        <img src="assets/img/kwflash.png">
      </div>
    </a>
    <a href="/" class="simple-text logo-normal">
      KW Flash
    </a>
  </div>
  <ul class="nav">
    <ng-container *ngFor="let menuItem of menuItems">
      <li routerLinkActive="active" class="{{ menuItem.class }}">
        <a [routerLink]="[menuItem.path]" *ngIf="isRoleAdmin() || menuItem.path !== '/add-school'">
          <i class="nc-icon {{ menuItem.icon }}"></i>
          <p>{{ menuItem.title }}</p>
        </a>
      </li>
    </ng-container>
  </ul>
</div>
